server:
  port: 2333
  address: 127.0.0.1

lavalink:
  pluginsDir: './plugins-local'
  plugins:
    # YouTube source plugin（原生 youtube 已廢棄，改用此 plugin）
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: "youshallnotpass"
    sources:
      youtube: false      # 已廢棄，由 youtube-plugin 取代
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 225
    frameBufferDurationMs: 5000
    opusEncodingQuality: 5
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 3
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    oauth:
      enabled: false
    clients:
      - "MUSIC"
      - "ANDROID_VR"
      - "WEB"
      - "WEBEMBEDDED"

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    lavaplayer: INFO
    org.springframework: WARN
    org.slf4j: WARN
